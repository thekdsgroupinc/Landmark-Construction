 <!-- === REINFORCED JAVASCRIPT BELOW === -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Instantly reveals the pricing page elements once loaded
      document.body.classList.add('page-loaded');

      // 2. Intercept link clicks safely so the page doesn't get stuck on menus/popups
      const links = document.querySelectorAll('a:not([target="_blank"])');
      links.forEach(link => {
        link.addEventListener('click', (e) => {
          const href = link.getAttribute('href');

          // SAFETY CHECK: Skip fade-out if the link is empty or an anchor trigger on this page
          if (!href || href === '#' || href.startsWith('#') || href.startsWith('javascript:')) {
            return; 
          }

          e.preventDefault();
          const targetUrl = link.href;

          // Smoothly fade the whole page out before leaving
          document.body.style.opacity = '0';

          // Wait for the fade-out animation to finish, then redirect
          setTimeout(() => {
            window.location.href = targetUrl;
          }, 400); 
        });
      });
    });
  </script>
