/* Full screen dark/translucent background overlay */
.modal-overlay {
  position: fixed;
  top: 0; 
  left: 0; 
  right: 0; 
  bottom: 0;
  width: 100vw; 
  height: 100vh;
  background: rgba(0, 0, 0, 0.4); /* Dims the page content behind the popup */
  
  /* CRUCIAL LAYOUT FOR CENTERING: */
  display: flex;           
  align-items: center;     
  justify-content: center;  
  
  z-index: 1000;

  /* === ADDED FOR FADE ANIMATION === */
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.4s ease, visibility 0.4s ease;
}

/* === ADDED TO TRIGGER FADE IN === */
.modal-overlay.is-open {
  opacity: 1;
  visibility: visible;
}
/* The actual white box containing the form */
.modal-content {
  background: #fff;
  border-radius: 8px;
  padding: 40px 32px 24px 32px; /* Increased top padding so inputs don't touch the X button */
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
  min-width: 320px;
  max-width: 90vw;
  position: relative; /* Crucial for positioning the X button */
}

   /* Form input spacing */
#contactForm input,
#contactForm textarea {
  width: 100%;
  margin-bottom: 12px;
  box-sizing: border-box;
  display: block;
  padding: 8px;
}
    
/* The Close "X" Button */
.close-btn {
  position: absolute;
  right: 16px;
  top: 12px;
  font-size: 26px;
  cursor: pointer;
  color: #333;
  line-height: 1;
  z-index: 1010; /* Keeps the X clickable and on top of inputs */
}
.close-btn:hover {
  color: #008000; /* Turns green on hover so you know it's interactive */
}
/* Style for your specific submit button */
#contactForm button[type="submit"] {
  width: 100%;
  background-color: #008000; /* Your exact green color */
  color: #ffffff;            /* Pure white text */
  border: none;
  padding: 12px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 6px;        /* Rounds the button corners */
  cursor: pointer;
  transition: background 0.2s ease;
}
#contactForm button[type="submit"]:hover {
  background-color: #006400; /* Darker green on hover */
}
      /* === ADDED FOR SMOOTH PAGE TRANSITIONS === */
